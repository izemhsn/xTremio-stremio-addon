# CI/CD
#
# CI - on every push to main/dev and on every pull request:
#   1. Run the tests.
#   2. Check that the Docker image builds, for amd64 and arm64.
#
# CD - when you push a version tag:
#   3. Check that the tag matches the version in package.json.
#   4. Publish the Docker image to ghcr.io/izemhsn/xtremio-stremio-addon
#
# How to release:
#   npm version minor
#   git push --follow-tags

name: CI/CD

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:

# Read-only access to the repo by default (safer).
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Keep testing the other Node versions even if one fails.
      fail-fast: false
      matrix:
        # Every Node version the addon supports.
        node: ['22', '24']
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Install Node ${{ matrix.node }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  docker:
    # Wait until all tests pass.
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # allows pushing the image to ghcr.io
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      # The version in package.json is the one Stremio shows, so a tag that
      # disagrees with it would publish an image reporting the wrong version.
      - name: Check the tag matches package.json
        if: github.ref_type == 'tag'
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$expected" != "${{ github.ref_name }}" ]; then
            echo "Tag ${{ github.ref_name }} does not match package.json ($expected). Release with: npm version <patch|minor|major>"
            exit 1
          fi

      # QEMU and Buildx let this runner build the arm64 image (Raspberry Pi and
      # other ARM boards) next to the usual amd64 one.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: github.ref_type == 'tag'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # GitHub creates this token automatically

      # Builds on every run, and pushes only for a version tag.
      - name: Build the Docker image (and publish it for a version tag)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref_type == 'tag' }}
          tags: |
            ghcr.io/izemhsn/xtremio-stremio-addon:${{ github.ref_name }}
            ghcr.io/izemhsn/xtremio-stremio-addon:latest
